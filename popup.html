<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频小窗</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>视频小窗</h1>
    <p>主视频滚出屏幕时，右下角自动出现小播放框</p>
  </header>
  <label class="switch-row">
    <span>启用小窗</span>
    <input type="checkbox" id="enabled" />
  </label>
  <p class="hint">刷新页面后生效于已打开标签页；新页面自动应用。</p>
  <script src="popup.js"></script>
</body>
</html>
